name: Engineering change
description: Propose a code, data, contract, release, migration, or retirement change.
title: "[change] "
body:
  - type: markdown
    attributes:
      value: |
        Organization members should first read the [canonical engineering policy](https://github.com/Albert-Maxwell/amt-meta/blob/main/ENGINEERING.md). Repository-local instructions and owning contracts remain authoritative when they are more specific.
  - type: textarea
    id: current
    attributes:
      label: Current behavior and owner
      description: Describe what happens today, who owns it, and the current evidence for the problem.
      placeholder: Current behavior, owner, consumers, and evidence...
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change and affected surface
      description: Describe the smallest complete change and list affected code, interfaces, repositories, artifacts, deployments, and consumers.
      placeholder: Proposed behavior and affected surfaces...
    validations:
      required: true
  - type: textarea
    id: reuse
    attributes:
      label: Reuse decision
      description: State which existing owner, maintained library, or current dependency is reused, or explain why none applies.
      placeholder: Reused owner or dependency, with evidence; or None with a reason...
    validations:
      required: true
  - type: textarea
    id: obsolete
    attributes:
      label: Obsolete paths to delete
      description: Name old code, aliases, fallbacks, workflows, artifacts, or duplicate paths this change removes and when.
      placeholder: Paths and deletion point; or None with a reason...
    validations:
      required: true
  - type: textarea
    id: dependency_order
    attributes:
      label: Dependency and rollout order
      description: For cross-repository or breaking changes, give the owner-first release, consumer migration, verification, and old-contract removal order.
      placeholder: Ordered rollout, or None with a reason...
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data preservation and migration
      description: State how existing data is preserved, including the owning migration and recovery evidence for any authorized change.
      placeholder: Preservation, migration, retention, and recovery evidence; or None with a reason...
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification and recovery
      description: Give tests, operational evidence, success postconditions, and rollback or recovery steps.
      placeholder: Tests, evidence, postconditions, and rollback or recovery...
    validations:
      required: true
  - type: textarea
    id: retirement
    attributes:
      label: Interim-state retirement
      description: Name the owner, tracking issue, and exact removal condition for every temporary path.
      placeholder: Owner, tracking issue, and retirement condition; or None with a reason...
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I reconciled this proposal with the repository-specific instructions and owning contracts.
          required: true
        - label: Each rollout stage leaves a working, verifiable system.
          required: true
