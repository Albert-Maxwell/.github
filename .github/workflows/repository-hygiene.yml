name: Organization repository hygiene

on:
  workflow_call:
    inputs:
      runner:
        description: "GitHub-hosted Ubuntu or approved Linux runner label."
        required: false
        default: ubuntu-latest
        type: string

permissions:
  contents: read

jobs:
  generated-artifacts:
    name: generated-artifacts
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    steps:
      - name: Check out repository under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: consumer-repository
          persist-credentials: false

      - name: Check out the hygiene gate beside this reusable workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GitHub supports these reusable-workflow identity fields; actionlint
          # 1.7.12 has not added them to its job-context schema yet.
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .organization-repository-hygiene
          persist-credentials: false

      - name: Reject unsealed generated artifacts
        shell: bash
        run: >-
          python3
          .organization-repository-hygiene/repository-hygiene/check-generated-artifacts.py
          --repository "$GITHUB_WORKSPACE/consumer-repository"
