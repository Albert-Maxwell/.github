name: Organization secret scan

on:
  workflow_call:
    inputs:
      runner:
        description: "GitHub-hosted Ubuntu or approved Linux runner label."
        required: false
        default: ubuntu-latest
        type: string

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out repository under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the policy beside this reusable workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .organization-secret-scanning
          persist-credentials: false

      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: >-
          .organization-secret-scanning/secret-scanning/install-gitleaks.sh
          "${{ runner.temp }}/gitleaks"

      - name: Scan introduced commits or full history
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.organization-secret-scanning/secret-scanning/gitleaks.toml
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          readonly scan=.organization-secret-scanning/secret-scanning/run-gitleaks.sh
          case "$EVENT_NAME" in
            pull_request)
              "$scan" changes "$BASE_SHA" "$HEAD_SHA"
              ;;
            push)
              if [[ $BASE_SHA == 0000000000000000000000000000000000000000 ]]; then
                "$scan" history
              else
                "$scan" changes "$BASE_SHA" "$HEAD_SHA"
              fi
              ;;
            workflow_dispatch)
              "$scan" history
              ;;
            *)
              echo "unsupported caller event: $EVENT_NAME" >&2
              exit 2
              ;;
          esac
