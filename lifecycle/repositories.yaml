  lifecycle_review: "https://github.com/Albert-Maxwell/.github/issues/2"
  owner_assignment: "Issue #2 explicitly assigns every implementation issue to @super-dainiu; this registry uses that assignee as the accountable owner until an owning issue records a transfer."
unknown_policy:
  token_prefix: "unknown — TODO("
  meaning: "The 2026 review did not establish this fact. The parenthesized issue owns discovery; do not infer or silently replace the value."
  acceptance_effect: "An unknown value keeps the inventory honest but does not satisfy that field under strict issue #1 acceptance; resolve it or explicitly amend the acceptance decision before closing #1."
  empty_issue_list: "No owning issue of that type was created by the 2026 review; an empty list is not an unknown value."
  none_prefix: "none — means the review established that the field is not applicable or that no current consumer/mechanism was found."

