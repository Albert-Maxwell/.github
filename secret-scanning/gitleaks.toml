title = "Albert-Maxwell organization secret scanning"

# Keep the maintained upstream rules (including generic-api-key entropy,
# private keys, cloud credentials, Coinbase/Kucoin, and Telegram bot tokens)
# and add organization-specific exchange and Telegram forms below.
[extend]
useDefault = true

[[rules]]
id = "albert-maxwell-exchange-credential"
description = "Detected a credential assigned to a supported cryptocurrency exchange."
regex = '''(?i)(?:binance|okx|okex|bybit|gate(?:\.?io)?|kucoin|coinbase|bitget|mexc)[\w .-]{0,32}?(?:api[_. -]?(?:key|secret)|secret[_. -]?key|passphrase|password|token)[\w .-]{0,16}?(?:=|>|:{1,3}=|:|=>|,)[\x60'"\s=]{0,5}([A-Za-z0-9+/=_-]{8,160})(?:[\x60'"\s;]|\\[nr]|$)'''
secretGroup = 1
entropy = 3.0
keywords = [
  "binance",
  "okx",
  "okex",
  "bybit",
  "gate",
  "kucoin",
  "coinbase",
  "bitget",
  "mexc",
]
tags = ["exchange", "financial"]

[[rules]]
id = "albert-maxwell-telegram-bot-token"
description = "Detected a Telegram bot token, including tokens without a nearby variable name."
regex = '''(?:^|[^0-9])([0-9]{5,16}:AA[A-Za-z0-9_-]{33})(?:$|[^A-Za-z0-9_-])'''
secretGroup = 1
entropy = 3.0
keywords = [":AA"]
tags = ["telegram"]

[[rules]]
id = "albert-maxwell-telegram-api-hash"
description = "Detected a Telegram client API hash."
regex = '''(?i)(?:telegram|telethon|pyrogram|tg)[\w .-]{0,24}?(?:api[_. -]?hash)[\w .-]{0,16}?(?:=|>|:{1,3}=|:|=>|,)[\x60'"\s=]{0,5}([a-f0-9]{32})(?:[\x60'"\s;]|\\[nr]|$)'''
secretGroup = 1
entropy = 3.0
keywords = ["telegram", "telethon", "pyrogram", "tg"]
tags = ["telegram"]

[[rules]]
id = "albert-maxwell-telegram-session"
description = "Detected a high-entropy Telegram client session string."
regex = '''(?i)(?:telegram|telethon|pyrogram|tg)[\w .-]{0,24}?(?:string[_. -]?session|session(?:[_. -]?(?:string|token|secret))?)[\w .-]{0,16}?(?:=|>|:{1,3}=|:|=>|,)[\x60'"\s=]{0,5}([A-Za-z0-9_-]{40,512})(?:[\x60'"\s;]|\\[nr]|$)'''
secretGroup = 1
entropy = 4.0
keywords = ["telegram", "telethon", "pyrogram", "tg", "session"]
tags = ["telegram", "session"]
